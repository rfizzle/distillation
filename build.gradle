plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'jacoco'
}

jacoco {
    toolVersion = '0.8.12'
}

version = computeModVersion()
group = project.maven_group

tasks.register('printVersion') {
    doLast { println project.version }
}

// Derives a SemVer-compliant version from `mod_version` plus the git state:
//   - exact tag match (e.g. HEAD == v0.0.0) → "0.0.0"
//   - exact tag, dirty tree                      → "0.0.0+dirty"
//   - N commits past the last matching tag       → "0.0.0+N.gSHA[.dirty]"
//   - no matching tag yet                        → "0.0.0+gSHA[.dirty]"
//   - git unavailable or describe fails          → "0.0.0"
// The base ("0.0.0") comes from gradle.properties and is bumped via
// scripts/release.sh. Tag pattern is `v*`.
def computeModVersion() {
    def base = project.mod_version
    def tagPrefix = "v"
    def described = runGitDescribe(tagPrefix)
    if (described == null || described.isEmpty()) {
        return base
    }
    if (described == "${tagPrefix}${base}") {
        return base
    }
    if (described == "${tagPrefix}${base}-dirty") {
        return "${base}+dirty"
    }
    def postTag = described =~ /^\Q${tagPrefix}\E(\S+?)-(\d+)-g([0-9a-f]+)(-dirty)?$/
    if (postTag.matches()) {
        def commits = postTag[0][2]
        def sha = postTag[0][3]
        def dirty = postTag[0][4] ? '.dirty' : ''
        return "${base}+${commits}.g${sha}${dirty}"
    }
    def shaOnly = described =~ /^([0-9a-f]+)(-dirty)?$/
    if (shaOnly.matches()) {
        def sha = shaOnly[0][1]
        def dirty = shaOnly[0][2] ? '.dirty' : ''
        return "${base}+g${sha}${dirty}"
    }
    return base
}

def runGitDescribe(String tagPrefix) {
    try {
        def proc = new ProcessBuilder('git', 'describe', '--tags',
                '--match', "${tagPrefix}*", '--dirty', '--always')
                .directory(rootDir)
                .redirectErrorStream(true)
                .start()
        proc.waitFor()
        def out = proc.inputStream.text.trim()
        if (proc.exitValue() != 0) return null
        return out
    } catch (Exception ignored) {
        return null
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/'
        content {
            includeGroup 'dev.emi'
        }
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
        content {
            includeGroup 'me.shedaniel'
            includeGroup 'me.shedaniel.cloth'
            includeGroup 'dev.architectury'
        }
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
        content {
            includeGroup 'dev.architectury'
        }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    // GitHub Releases — resolves sibling Concord mods straight from their release jars while
    // their Modrinth projects are not publicly resolvable. Artifact-only (no metadata), scoped
    // to the rfizzle org so it never shadows a real Maven group.
    ivy {
        name = 'GitHubReleases'
        url = 'https://github.com'
        patternLayout {
            artifact '/[organisation]/[module]/releases/download/v[revision]/[module]-[revision].jar'
        }
        metadataSources {
            artifact()
        }
        content {
            includeGroup 'rfizzle'
        }
    }
    maven {
        name = 'Bai'
        url = 'https://maven2.bai.lol'
        content {
            includeGroup 'lol.bai'
            includeGroup 'mcp.mobius.waila'
        }
    }
}

loom {
    splitEnvironmentSourceSets()
    accessWidenerPath = file("src/main/resources/distillation.accesswidener")
}

sourceSets {
    main {
        resources {
            srcDirs += [ "src/main/generated" ]
        }
    }
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
    // Put the client source set's compiled output (not its dependency configurations) on the
    // test classpath so unit tests can reach client-only classes such as ClientDistillationConfig.
    // Only .output is added — never client.compileClasspath/runtimeClasspath — so the unmapped
    // fabric-api sibling access widener that the testRuntimeClasspath exclusion below guards
    // against is never pulled in.
    test {
        compileClasspath += sourceSets.client.output
        runtimeClasspath += sourceSets.client.output
    }
}

configurations {
    gametestImplementation.extendsFrom implementation
    gametestRuntimeOnly.extendsFrom runtimeOnly
}

// Minecraft's GameTestServer aborts ("No test functions were given!") when zero @GameTest
// functions are registered, so runGametest would fail CI until the first gametest lands.
// Skip the run while the gametest source set is empty; it runs normally once tests exist.
// Loom registers runGametest during afterEvaluate, so match it lazily rather than by name.
tasks.matching { it.name == 'runGametest' }.configureEach {
    onlyIf {
        !sourceSets.gametest.allJava.files.isEmpty()
    }
}

loom {
    runs {
        datagen {
            inherit server
            name "Data Generation"
            vmArg "-Dfabric-api.datagen"
            vmArg "-Dfabric-api.datagen.output-dir=${file("src/main/generated")}"
            vmArg "-Dfabric-api.datagen.modid=distillation"
            runDir "build/datagen"
        }
        gametest {
            server()
            name "Game Test"
            source sourceSets.gametest
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('junit-gametest.xml').get().asFile}"
            runDir "build/gametest"
        }
    }
}

dependencies {
    // Minecraft
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    // Fabric
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Client source set: no separate fabric-api entry — with splitEnvironmentSourceSets the
    // client set inherits the remapped fabric-api from modImplementation. A raw
    // "clientImplementation"(fabric-api) line puts the UNREMAPPED jar on the client runtime,
    // whose nested intermediary access wideners abort a named-namespace dev launch.

    // ModMenu 11.x — Config screen entry point for Fabric 1.21.1. Compile-only + dev runtime
    // so end users get the integration only when they install ModMenu themselves.
    modCompileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
    modLocalRuntime "maven.modrinth:modmenu:${project.modmenu_version}"

    // Cloth Config 15.x — Config screen builder used by ModMenuIntegration. Compile-only for
    // the api surface; full mod in dev runtime.
    modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    modLocalRuntime "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"

    // Jade 15.x — Probe-tooltip integration. No api split published; compile-only links the
    // full mod but only the snownee.jade.api surface is referenced.
    modCompileOnly "maven.modrinth:jade:${project.jade_version}"
    modLocalRuntime "maven.modrinth:jade:${project.jade_version}"

    // WTHIT 12.x — Alternative probe-tooltip integration (Jade fallback). Compile-only against
    // the API split. Discovered via waila_plugins.json at runtime.
    modCompileOnly "mcp.mobius.waila:wthit-api:${project.wthit_version}"

    // EMI 1.x — Recipe viewer brewing category.
    modCompileOnly "dev.emi:emi-fabric:${project.emi_version}:api"
    modLocalRuntime "dev.emi:emi-fabric:${project.emi_version}"

    // REI 16.x — Recipe viewer brewing category (MC 1.21, runs on 1.21.1). REI's runtime jar
    // transitively pins fabric-api 0.102.0, whose nested module jars ship intermediary-namespace
    // access wideners that abort a named-namespace dev launch ("Failed to read accessWidener");
    // excluding the group keeps the 0.116.1 pinned above as the only fabric-api on the classpath.
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${project.rei_version}"
    modLocalRuntime("me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}") {
        exclude group: 'net.fabricmc.fabric-api'
    }
    modLocalRuntime("dev.architectury:architectury-fabric:${project.architectury_version}") {
        exclude group: 'net.fabricmc.fabric-api'
    }

    // JEI 19.x — Recipe viewer brewing category. The `fabric` runtime jar shades in all
    // `common-api` classes, so `transitive = false` prevents Loom remap from seeing the
    // same classes twice and emitting `duplicate input class` warnings.
    modCompileOnly "mezz.jei:jei-1.21.1-fabric-api:${project.jei_version}"
    modLocalRuntime("mezz.jei:jei-1.21.1-fabric:${project.jei_version}") {
        transitive = false
    }

    // Tribulation — sibling Concord mod; soft dependency for the shard-debuff antidote lines.
    // Compile-only against its api package behind isModLoaded guards, never bundled. Resolved
    // from the GitHub release jar (GitHubReleases ivy repo) because the Modrinth project is not
    // publicly resolvable; swap to maven.modrinth once it is.
    modCompileOnly "rfizzle:tribulation:${project.tribulation_version}"

    // Tests
    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.junit.jupiter:junit-jupiter-params"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // Knot-based classloader that boots Fabric before tests run — registries,
    // item registrations, and onInitialize are available without Bootstrap.bootStrap().
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

// With splitEnvironmentSourceSets, loom remaps fabric-api to *-common variants for the main
// runtime classpath but leaves the unmapped fabric-api sibling on testRuntimeClasspath.
// fabric-loader-junit then reads both the remapped (named) AW and the unmapped (intermediary)
// AW and aborts on namespace mismatch. Dropping the unmapped sibling keeps the remapped
// artifacts in place and lets the junit launcher boot.
configurations.testRuntimeClasspath {
    exclude group: 'net.fabricmc.fabric-api', module: 'fabric-api'
}

test {
    useJUnitPlatform()
    // ManifestEntrypointTest reads the gametest sources and the shipped manifest off disk at
    // runtime, which Gradle cannot infer. Declaring them as inputs keeps a gametest-only change
    // from leaving this task UP-TO-DATE and skipping the entrypoint parity guard.
    inputs.files(sourceSets.gametest.allSource)
            .withPropertyName('gametestSources')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.file('src/main/resources/fabric.mod.json')
            .withPropertyName('shippedManifest')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

// Attach the JaCoCo agent to the gametest server so code only exercised in-game
// (brew completion, batch stands, commands, registration) counts toward coverage. The
// includes filter keeps the agent from instrumenting Minecraft/Fabric classes.
// Matched lazily for the same reason as the onlyIf guard above: Loom registers
// runGametest during afterEvaluate, so it cannot be resolved by name here.
tasks.matching { it.name == 'runGametest' }.configureEach {
    jacoco.applyTo(it)
    it.jacoco.destinationFile = layout.buildDirectory.file('jacoco/runGametest.exec').get().asFile
    it.jacoco.includes = ['com.rfizzle.distillation.*']
    // The agent's exec file is an @OutputFile, which would otherwise make this
    // JavaExec up-to-date-checkable and silently skip the whole in-world suite on
    // a repeat run — re-emitting the previous coverage number as if it were fresh.
    // A gametest sweep must always execute.
    it.outputs.upToDateWhen { false }
}

// Single source of coverage truth: unit tests + gametests merged over src/main.
// jacocoTestReport covers the test task alone, which reads every gametest-only line
// as a miss — read per-package coverage from this report, never from that one.
tasks.register('jacocoMergedReport', JacocoReport) {
    description = 'Merges unit-test and gametest execution data into one coverage report'
    group = 'verification'
    // The report reads compileJava/processResources output, so it must depend on them —
    // without this, any invocation that compiles without also scheduling a test task
    // (e.g. `gradlew jar jacocoMergedReport`) fails Gradle's implicit-dependency validation.
    dependsOn tasks.named('classes')
    // Ordering only — not dependsOn, so the report can run from existing exec data
    // without forcing a gametest server spin-up.
    mustRunAfter test, tasks.matching { it.name == 'runGametest' }
    // fileTree only picks up exec files that exist, so the report still runs when
    // one of the two sweeps hasn't.
    executionData fileTree(layout.buildDirectory.dir('jacoco')) {
        include 'test.exec', 'runGametest.exec'
    }
    // A sweep that never ran leaves its exec file absent, and one that was interrupted
    // leaves it empty — Gradle deletes the file before the run and the agent only dumps
    // at JVM exit. Either way the result is a partial number under the "merged" label
    // with no indication, so say so.
    doFirst {
        ['test.exec', 'runGametest.exec'].each { name ->
            def execFile = layout.buildDirectory.file("jacoco/${name}").get().asFile
            if (!execFile.exists() || execFile.length() == 0) {
                logger.warn("jacocoMergedReport: ${name} is missing or empty — this report is NOT merged coverage")
            }
        }
    }
    sourceSets sourceSets.main
    // Mixin bodies execute inside the transformed vanilla classes, so the agent can
    // never attribute coverage to the mixin class files — excluding them keeps the
    // denominator honest. What branching does live in a mixin body (the brewing-stand
    // takeover dispatch) is covered indirectly through the handlers it delegates to.
    // Derive from sourceSets.main lazily: the eager
    // `files(classDirectories.files.collect { … })` form resolves at configuration
    // time and discards the task dependency on `classes`.
    classDirectories.setFrom(files(sourceSets.main.output).asFileTree.matching {
        exclude 'com/rfizzle/distillation/mixin/**'
    })
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.register('verifyDatagenIdempotent') {
    description = 'Runs datagen and asserts git reports no changes in src/main/generated/'
    group = 'verification'
    dependsOn 'runDatagen'
    // The check shells out to git against live working-tree state, which Gradle cannot model as
    // task inputs. Declaring the incompatibility keeps the intent explicit rather than leaving a
    // hard failure for whoever enables the configuration cache.
    notCompatibleWithConfigurationCache('shells out to git against live working-tree state')
    doLast {
        def genDir = file('src/main/generated').absolutePath
        // Fail with an actionable message when git itself cannot run. ignoreExitValue covers a
        // nonzero exit, not a process that never starts, so an absent binary surfaces here as a
        // bare process-start exception naming neither datagen nor a remedy.
        def runGit = { List<String> argv ->
            try {
                def out = providers.exec {
                    commandLine argv
                    ignoreExitValue = true
                }
                // providers.exec is lazy — the process starts on the first result read, so force
                // it here to keep a failure to start inside this catch rather than at the use site.
                out.result.get()
                return out
            } catch (Exception e) {
                throw new GradleException(
                        'verifyDatagenIdempotent needs git on PATH to inspect src/main/generated/, ' +
                        'and could not run it: ' + e.message, e)
            }
        }
        // Keep both git outputs readable, and say so when truncating: a run that rewrites a large
        // provider's output lists hundreds of files, and git's own diagnostics are unbounded too.
        def firstLines = { String text ->
            def lines = text.trim().readLines()
            lines.size() > 5 ? lines.take(5).join('\n') + "\n… (${lines.size()} lines total)"
                             : lines.join('\n')
        }
        // The '--' separator is required: without it git parses the path as a revision-or-path,
        // and aborts with exit 128 ("ambiguous argument") whenever src/main/generated is neither
        // tracked nor present — which is the steady state while no fabric-datagen entrypoint is
        // declared. With it, a missing directory is simply an empty pathspec and exits 0.
        //
        // --porcelain reports all three drift shapes in one machine-readable listing: staged
        // ('M '), unstaged (' M'), and untracked ('??'). A git diff check sees only the
        // worktree-versus-index delta, so drift that has been git add-ed slips past it while
        // staying invisible to ls-files --others as well — a verification task passing on real
        // drift. Reading stdout also frees every nonzero exit to mean git itself failed, and
        // unlike 'git diff HEAD' this works in a repository with no commits yet.
        def statusResult = runGit(['git', 'status', '--porcelain', '--', genDir])
        // A failing git writes nothing to stdout, so an unchecked exit code would read as
        // "no changes" — a verification task reporting clean because its tool broke.
        def statusExit = statusResult.result.get().exitValue
        if (statusExit != 0) {
            throw new GradleException(
                    "git status failed with exit ${statusExit} while checking src/main/generated/:\n" +
                    firstLines(statusResult.standardError.asText.get()))
        }
        def dirty = statusResult.standardOutput.asText.get().trim()
        if (!dirty.isEmpty()) {
            throw new GradleException(
                    'src/main/generated/ changed after runDatagen:\n' + firstLines(dirty) +
                    '\nRun ./gradlew runDatagen, then git add and commit the results.')
        }
    }
}

processResources {
    inputs.property "version", project.version

    // Scoped to the main source set: the gametest source set gets its own
    // processGametestResources task with no expand filter, so a "${version}" placeholder in
    // src/gametest/resources/fabric.mod.json would reach the loader as that literal string and
    // fail semver parsing. That manifest hardcodes its version instead.
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }

    exclude "**/.gitkeep"
    exclude "**/.cache"
}

processClientResources {
    exclude "**/.gitkeep"
    exclude "**/.cache"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21

    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
    exclude "**/.gitkeep"
    exclude "**/.cache"
}

tasks.named('sourcesJar') {
    exclude "**/.gitkeep"
    exclude "**/.cache"
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
